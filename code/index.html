<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>2b - Xatbot</title>
  <style>
     /* Estils del widget del xatbot */
    #chatbot-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      max-height: 400px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: Arial, sans-serif;
      z-index: 9999;
    }


    #chat-header {
      background-color: #1b5e20; /* Verd fosc Vinyes Velles */
      color: white;
      padding: 10px;
      text-align: center;
      font-weight: bold;
    }


    #chat-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }


    .message {
      margin: 5px 0;
    }


    .user {
      text-align: right;
      color: #1b5e20;
    }


    .bot {
      text-align: left;
      color: #333;
    }


    #chat-input {
      display: flex;
      border-top: 1px solid #ccc;
    }


    #chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
      font-size: 14px;
    }


    #chat-input button {
      padding: 10px;
      background-color: #1b5e20;
      color: white;
      border: none;
      cursor: pointer;
    }


    #chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #0f5e42;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 30px;
      cursor: pointer;
      z-index: 9998;
    }
 

  </style>
  </head>
<body>


<!-- Botó flotant per obrir el widget -->
<button id="chat-toggle">💬</button>


<!-- Widget del xatbot -->
<div id="chatbot-widget" style="display:none;">
  <div id="chat-header">Xatbot 2b</div>
  <div id="chat-body">
    <div class="message bot">hola, soc el chat bot de aquesta web, Estic aquí per escoltar-te. Com et sents avui?</div>
  </div>
  <div id="chat-input">
    <input type="text" id="user-input" placeholder="Escriu una pregunta..." />
    <button onclick="enviaMissatge()">📨</button>
  </div>
</div>
<script>
   // Mostra o amaga el widget del xat
  document.getElementById('chat-toggle').addEventListener('click', function () {
    const widget = document.getElementById('chatbot-widget');
    widget.style.display = (widget.style.display === 'none') ? 'flex' : 'none';
  });


  // Envia el missatge de l'usuari i genera resposta
  function enviaMissatge() {
    const input = document.getElementById('user-input');
    const missatge = input.value.trim();
    if (!missatge) return;


    mostraMissatge(missatge, 'user');
    input.value = '';


    setTimeout(() => {
      const resposta = generaResposta(missatge);
      mostraMissatge(resposta, 'bot');
    }, 500);
  }


  // Mostra missatge a l'interior del xat
  function mostraMissatge(text, tipus) {
    const div = document.createElement('div');
    div.className = `message ${tipus}`;
    div.textContent = text;
    document.getElementById('chat-body').appendChild(div);
    document.getElementById('chat-body').scrollTop = document.getElementById('chat-body').scrollHeight;
  }


  // Genera resposta segons paraules clau
  function generaResposta(missatge) {
    missatge = missatge.toLowerCase();


    // Respostes predefinides relacionades amb el centre
    if (missatge.includes("hola")) return "Hola, soc 2b, el chat bot de aquesta web Estic aquí per escoltar-te. Com et sents avui?";
    if (missatge.includes("trist") || missatge.includes("malament")|| missatge.includes("malament")) return "Ho sento molt, Sentir-se així pot ser dur. Vols explicar-me què t’ha fet sentir així?";
    if (missatge.includes("ansietat") || missatge.includes("nervis") || missatge.includes("angoixa")) return "Gràcies per compartir-ho. Pot ajudar fer una respiració lenta ara mateix: inspira 4 segons, aguanta 4, expira 6. Vols provar-ho junts?";
    if (missatge.includes("sol") || missatge.includes("solitud")) return "Sentir-se sol pot fer molt de mal, però no estàs sol aquí Què és el que més trobes a faltar ara mateix?";
    if (missatge.includes("estrès") || missatge.includes("cansat") || missatge.includes("esgotat")) return "Sembla que portes molta càrrega a sobre. Quan va ser l’última vegada que vas descansar de debò?";
    if (missatge.includes("no puc") || missatge.includes("no valc") || missatge.includes("incapaç")) return "Entenc que et sentis així, però el que sents no defineix qui ets. Has superat coses difícils abans, encara que ara no ho sembli.";
    if (missatge.includes("no vull viure") || missatge.includes("fer-me mal")) return "Em sap greu que estiguis passant per això. És important que parlis amb algú de confiança o amb un professional. Si estàs en perill immediat, busca ajuda al 112";
    if (missatge.includes("gràcies")) return "Gràcies a tu per confiar en mi Estic aquí sempre que ho necessitis.";
    if (missatge.includes("adéu") || missatge.includes("adeu")) return "Cuida’t molt Recorda que demanar ajuda és un acte de valentia.";



    // Per defecte
    return "Ho sento, no tinc informació sobre això. Pots consultar la web o contactar amb el centre.";
  }
</script>
</body>
</html>
